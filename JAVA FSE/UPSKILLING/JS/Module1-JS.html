<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Community Event Portal</title>

<script>
window.onload=function(){
    console.log("Welcome to the Community Portal");
    alert("Page Fully Loaded");

    const eventName="Music Festival";
    const eventDate="2026-08-15";
    let seats=50;

    console.log(`Event: ${eventName}, Date: ${eventDate}, Seats: ${seats}`);

    seats--;

    const events=[
        {name:"Music Festival",category:"Music",seats:10,upcoming:true},
        {name:"Workshop",category:"Education",seats:20,upcoming:true},
        {name:"Old Event",category:"Music",seats:0,upcoming:false}
    ];

    events.forEach(event=>{
        if(event.upcoming && event.seats>0){
            displayEvent(event);
        }
    });

    class Event{
        constructor(name,category,seats){
            this.name=name;
            this.category=category;
            this.seats=seats;
        }
    }

    Event.prototype.checkAvailability=function(){
        return this.seats>0;
    };

    const e1=new Event("Dance Show","Music",30);

    console.log(Object.entries(e1));

    events.push({
        name:"Baking Workshop",
        category:"Education",
        seats:15,
        upcoming:true
    });

    console.log(
        events.filter(e=>e.category==="Music")
    );

    console.log(
        events.map(e=>"Workshop on "+e.name)
    );

    const {name,category,seats:availableSeats}=events[0];

    console.log(name,category,availableSeats);

    const clonedEvents=[...events];

    async function loadData(){
        document.getElementById("loading").innerHTML="Loading...";

        try{
            const response=await fetch("https://jsonplaceholder.typicode.com/posts");
            const data=await response.json();
            console.log(data);
        }
        catch(error){
            console.log(error);
        }

        document.getElementById("loading").innerHTML="";
    }

    loadData();

    debugger;
};

function addEvent(event){
    console.log(event);
}

function registerUser(eventName){
    try{
        alert("Registered for "+eventName);
    }
    catch(error){
        console.log(error);
    }
}

function filterEventsByCategory(category,callback){
    callback(category);
}

function registrationCounter(){
    let count=0;

    return function(){
        count++;
        return count;
    };
}

const musicCounter=registrationCounter();

function displayEvent(event){

    const card=document.createElement("div");

    card.innerHTML=
    `<h3>${event.name}</h3>
     <button onclick="registerUser('${event.name}')">
     Register
     </button>`;

    document.querySelector("#eventContainer")
    .appendChild(card);
}

function filterCategory(){
    const value=
    document.querySelector("#categoryFilter").value;

    alert("Selected Category: "+value);
}

function searchEvent(){
    console.log("Searching...");
}

function submitForm(event){

    event.preventDefault();

    const form=
    document.forms["registerForm"];

    const name=form.elements["name"].value;
    const email=form.elements["email"].value;
    const selectedEvent=form.elements["event"].value;

    let valid=true;

    if(name===""){
        document.getElementById("nameError").innerHTML=
        "Name Required";
        valid=false;
    }

    if(email===""){
        document.getElementById("emailError").innerHTML=
        "Email Required";
        valid=false;
    }

    if(valid){

        setTimeout(()=>{

            fetch("https://jsonplaceholder.typicode.com/posts",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    name,
                    email,
                    selectedEvent
                })
            })

            .then(response=>response.json())

            .then(data=>{
                alert("Registration Successful");
            })

            .catch(error=>{
                alert("Registration Failed");
            });

        },2000);

        console.log("Form Submitted");
    }
}
</script>

</head>
<body>

<h1>Local Community Event Portal</h1>

<select id="categoryFilter" onchange="filterCategory()">
    <option>Music</option>
    <option>Education</option>
</select>

<input type="text"
id="search"
placeholder="Search Event"
onkeydown="searchEvent()">

<div id="eventContainer"></div>

<div id="loading"></div>

<form name="registerForm" onsubmit="submitForm(event)">

    <input type="text"
    name="name"
    placeholder="Name">

    <span id="nameError"></span>

    <br><br>

    <input type="email"
    name="email"
    placeholder="Email">

    <span id="emailError"></span>

    <br><br>

    <select name="event">
        <option>Music Festival</option>
        <option>Baking Workshop</option>
    </select>

    <br><br>

    <button type="submit" id="registerBtn">
        Register
    </button>

</form>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
$("#registerBtn").click(function(){
    $("#eventContainer").fadeOut();
    $("#eventContainer").fadeIn();
});
</script>

</body>
</html>
