<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Local Community Event Portal</title>

<style>
#welcomeBanner{
    background: blue;
    color: white;
    padding: 10px;
}
.highlight{
    background: yellow;
}
.imgBorder{
    border: 2px solid black;
}
form{
    border: 1px solid gray;
    padding: 10px;
    width: 400px;
}
</style>

<script>
function validatePhone(){
    let phone=document.getElementById("phone").value;
    if(phone.length!=10){
        alert("Invalid Phone Number");
    }
}

function showFee(){
    let event=document.getElementById("eventType").value;
    document.getElementById("fee").innerHTML="Selected Event: "+event;
}

function confirmRegistration(){
    document.getElementById("msg").value="Registration Successful";
}

function enlarge(img){
    img.width=300;
}

function countChars(){
    let len=document.getElementById("feedback").value.length;
    document.getElementById("count").innerHTML=len;
}

function videoReady(){
    document.getElementById("videoStatus").innerHTML="Video ready to play";
}

window.onbeforeunload=function(){
    return "Form not completed";
}

function savePreference(){
    localStorage.setItem(
        "event",
        document.getElementById("eventType").value
    );
}

function loadPreference(){
    let event=localStorage.getItem("event");
    if(event){
        document.getElementById("eventType").value=event;
    }
}

function clearPreferences(){
    localStorage.clear();
    sessionStorage.clear();
}

function findLocation(){
    navigator.geolocation.getCurrentPosition(
        function(position){
            document.getElementById("location").innerHTML=
            "Latitude: "+position.coords.latitude+
            "<br>Longitude: "+position.coords.longitude;
        },
        function(error){
            document.getElementById("location").innerHTML=
            error.message;
        },
        {
            enableHighAccuracy:true,
            timeout:5000
        }
    );
}
</script>

</head>

<body onload="loadPreference()">

<!-- Navigation -->
<nav>
    <a href="#home">Home</a>
    <a href="#events">Events</a>
    <a href="#contact">Contact</a>
    <a href="help.html" target="_blank">Help</a>
</nav>

<!-- Main -->
<main>

<section id="home">
    <div id="welcomeBanner">
        Welcome User
        <span style="color:red;font-weight:bold;">
            Special Offer
        </span>
    </div>

    <p class="highlight">Community Portal</p>
</section>

<section id="events">
    <h2>Event Gallery</h2>

    <table>
        <tr>
            <td>
                <img src="img1.jpg" alt="Event1" title="Event1"
                class="imgBorder">
                <p>Event 1</p>
            </td>

            <td>
                <img src="img2.jpg" alt="Event2" title="Event2"
                class="imgBorder">
                <p>Event 2</p>
            </td>

            <td>
                <img src="img3.jpg" alt="Event3" title="Event3"
                class="imgBorder">
                <p>Event 3</p>
            </td>
        </tr>

        <tr>
            <td>
                <img src="img4.jpg" alt="Event4" title="Event4"
                class="imgBorder">
                <p>Event 4</p>
            </td>

            <td>
                <img src="img5.jpg" alt="Event5" title="Event5"
                class="imgBorder">
                <p>Event 5</p>
            </td>

            <td>
                <img src="img6.jpg" alt="Event6" title="Event6"
                class="imgBorder">
                <p>Event 6</p>
            </td>
        </tr>
    </table>
</section>

<section>
    <h2>Event Registration</h2>

    <form>
        <input type="text" placeholder="Name" required autofocus>

        <input type="email" placeholder="Email" required>

        <input type="text" id="phone"
        placeholder="Phone Number"
        onblur="validatePhone()">

        <input type="date" required>

        <select id="eventType"
        onchange="showFee();savePreference();">
            <option>Music</option>
            <option>Sports</option>
            <option>Workshop</option>
        </select>

        <p id="fee"></p>

        <textarea placeholder="Message"></textarea>

        <button type="button"
        onclick="confirmRegistration()">
        Submit
        </button>

        <output id="msg"></output>
    </form>
</section>

<section>
    <h2>Feedback</h2>

    <img src="img1.jpg" width="150"
    ondblclick="enlarge(this)">

    <textarea id="feedback"
    onkeyup="countChars()"></textarea>

    <p>Characters: <span id="count">0</span></p>
</section>

<section>
    <h2>Promo Video</h2>

    <video controls width="300"
    oncanplay="videoReady()">
        <source src="video.mp4" type="video/mp4">
    </video>

    <p id="videoStatus"></p>
</section>

<section>
    <h2>User Preferences</h2>

    <button onclick="clearPreferences()">
        Clear Preferences
    </button>
</section>

<section>
    <h2>Find Nearby Events</h2>

    <button onclick="findLocation()">
        Find Nearby Events
    </button>

    <p id="location"></p>
</section>

<section id="contact">
    <h2>Contact</h2>
</section>

</main>

<!-- Footer -->
<footer>
    <p>Local Community Event Portal</p>
</footer>

</body>
</html>
